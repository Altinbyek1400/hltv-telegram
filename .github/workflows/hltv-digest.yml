name: HLTV Tier-1 digest

on:
  schedule:
    # UTC цагаар. 02:00 UTC = 10:00 УБ, 14:00 UTC = 22:00 УБ
    - cron: "0 2,14 * * *"
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESULT_WINDOW_HOURS: "12"
          UPCOMING_HOURS: "24"
        run: python hltv_digest.py
