name: CS2 daily overview

on:
  schedule:
    # 01:00 UTC = 09:00 УБ
    - cron: "0 1 * * *"
  workflow_dispatch: {}

concurrency:
  group: cs2-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Daily overview
        env:
          MODE: daily
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIERS: "s,a"
        run: python bot.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "cs2-bot"
            git config user.email "cs2-bot@users.noreply.github.com"
            git add state.json
            git commit -m "state: daily $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          else
            echo "Төлөв өөрчлөгдөөгүй."
          fi
