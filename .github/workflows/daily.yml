name: CS2 daily overview

on:
  schedule:
    # 01:00 UTC = 09:00 УБ
    - cron: "0 1 * * *"
  workflow_dispatch: {}

concurrency:
  group: cs2-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Daily overview
        env:
          MODE: daily
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIERS: "s,a"
        run: python bot.py

      - name: Save state
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: bash scripts/save_state.sh
